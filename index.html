<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONYXLABS | Automatización Inteligente para tu Negocio</title>
    <meta name="description" content="ONYXLABS le da a los pequeños negocios la ventaja injusta. Recupera tus fines de semana mientras nosotros manejamos lo repetitivo." />

    <!-- Google Fonts: Fun, bold typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Fun, vibrant palette
              'onyx': {
                950: '#0a0a0a',
                900: '#121212',
                800: '#1a1a1a',
                700: '#2a2a2a',
              },
              'cream': {
                50: '#FFFDF9',
                100: '#FFF9F0',
                200: '#FFF3E0',
              },
              'pop': {
                cyan: '#00E5FF',
                magenta: '#FF00E5',
                pink: '#FF6B9D',
                orange: '#FF8A50',
                yellow: '#FFE135',
                lime: '#BFFF00',
              },
            },
            fontFamily: {
              sans: ['"DM Sans"', 'sans-serif'],
              serif: ['"DM Serif Display"', 'serif'],
            },
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }

      /* Light cream background by default */
      body {
        background-color: #FFFDF9;
        color: #0a0a0a;
      }

      /* Gradient text */
      .gradient-text-fun {
        background: linear-gradient(135deg, #00E5FF 0%, #FF00E5 50%, #FF6B9D 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gradient-text-warm {
        background: linear-gradient(135deg, #FF8A50 0%, #FF00E5 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* 3D Sphere styles */
      .sphere {
        border-radius: 50%;
        position: absolute;
        pointer-events: none;
      }

      .sphere-gradient-1 {
        background: linear-gradient(135deg, #FF6B9D 0%, #FF00E5 50%, #00E5FF 100%);
        box-shadow:
          inset -20px -20px 40px rgba(0,0,0,0.2),
          inset 20px 20px 40px rgba(255,255,255,0.3),
          0 20px 60px rgba(255, 0, 229, 0.3);
      }

      .sphere-gradient-2 {
        background: linear-gradient(135deg, #00E5FF 0%, #BFFF00 100%);
        box-shadow:
          inset -15px -15px 30px rgba(0,0,0,0.15),
          inset 15px 15px 30px rgba(255,255,255,0.4),
          0 15px 40px rgba(0, 229, 255, 0.3);
      }

      .sphere-gradient-3 {
        background: linear-gradient(135deg, #FFE135 0%, #FF8A50 100%);
        box-shadow:
          inset -10px -10px 20px rgba(0,0,0,0.1),
          inset 10px 10px 20px rgba(255,255,255,0.5),
          0 10px 30px rgba(255, 138, 80, 0.3);
      }

      /* Blob gradient */
      .blob-gradient {
        background: linear-gradient(90deg, #FF8A50, #FF00E5, #00E5FF, #BFFF00);
        border-radius: 9999px;
        filter: blur(0px);
      }

      /* Marquee animation */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .animate-marquee {
        animation: marquee 20s linear infinite;
      }

      /* Float animation */
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      .animate-float-delayed {
        animation: float 6s ease-in-out infinite;
        animation-delay: -3s;
      }

      /* Button styles */
      .btn-dark {
        background: #0a0a0a;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-dark:hover {
        background: #2a2a2a;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      .btn-outline {
        background: transparent;
        border: 2px solid #0a0a0a;
        color: #0a0a0a;
        transition: all 0.3s ease;
      }

      .btn-outline:hover {
        background: #0a0a0a;
        color: white;
      }

      .btn-gradient {
        background: linear-gradient(135deg, #00E5FF 0%, #FF00E5 100%);
        color: white;
        transition: all 0.3s ease;
      }

      .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px rgba(255, 0, 229, 0.4);
      }

      /* Card styles */
      .card-light {
        background: white;
        border: 1px solid #f0f0f0;
        transition: all 0.3s ease;
      }

      .card-light:hover {
        border-color: #00E5FF;
        box-shadow: 0 20px 60px rgba(0, 229, 255, 0.1);
        transform: translateY(-4px);
      }

      .card-dark {
        background: #121212;
        color: white;
        transition: all 0.3s ease;
      }

      .card-dark:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 60px rgba(255, 0, 229, 0.2);
      }

      /* Highlight card (pricing) */
      .card-highlight {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        color: white;
        border: 2px solid #00E5FF;
        box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
      }

      /* Section dark */
      .section-dark {
        background: #0a0a0a;
        color: white;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #FFFDF9;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #00E5FF, #FF00E5);
        border-radius: 4px;
      }

      /* Selection */
      ::selection {
        background: rgba(0, 229, 255, 0.3);
        color: #0a0a0a;
      }

      /* Italic serif accent */
      .accent-italic {
        font-family: 'DM Serif Display', serif;
        font-style: italic;
      }
    </style>

{
  "imports": {

  }
}
</script>
</head>

  </body>
</html>
